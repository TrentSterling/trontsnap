[workspace]
# The hotkey broker is a separate crate because a build script emits ONE manifest
# per crate, and these two binaries need opposite manifests: the UI must stay
# non-uiAccess (Medium, so drag-out works) while the broker must be uiAccess
# (so binds survive elevated windows). See hotkeyd/build.rs.
members = ["hotkeyd"]

[patch.crates-io]
# eframe 0.29.1 leaves ControlFlow::Poll armed when a delayed repaint expires
# after a Windows root viewport is hidden. The local copy backports upstream's
# invisible-window repaint path without forcing an egui API migration.
eframe = { path = "vendor/eframe" }

[package]
name = "trontsnap"
version = "0.25.0"
edition = "2021"
description = "Fast screenshot tool: global-hotkey capture (full + freeze-frame region) straight to clipboard, plus a lazy-loading gallery over your whole screenshot history"

[dependencies]
# Rasterizes the annotation editor's Text tool into the saved PNG using the
# bundled Rajdhani TTF (egui only draws to the screen; baking needs our own
# glyph rendering). Pure Rust, tiny, no transitive weight.
ab_glyph = "0.2"
eframe = "0.29.1"
xcap = "0.0.15"
image = "0.24.9"
anyhow = "1"
chrono = "0.4"
dirs = "5"
trash = "5"
# "reveal" = select-in-file-manager, used by the gallery's Reveal on Linux
# (Windows goes through ShellExecuteW instead; the feature is harmless there).
opener = { version = "0.7", features = ["reveal"] }
crossbeam-channel = "0.5"
walkdir = "2"
notify = "6"
raw-window-handle = "0.6"

# === Windows-only OS integration ===
# The whole Win32 layer (clipboard formats, RegisterHotKey, GDI picker, Media
# Foundation, registry settings) plus tray + OLE drag-out. The Linux build swaps
# in src/linux/* modules instead (see main.rs), so none of these resolve there.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
winreg = "0.52"
drag = "2.1.1"
# Global hotkeys (RegisterHotKey), shutter sound, and the multi-format clipboard
# writer all use Win32 directly. windows 0.56 is already in the lockfile (via
# trash/opener), so this only adds features to the resolved version, no
# duplicate copy.
windows = { version = "0.56", features = [
    # WinRT namespaces for region OCR (Windows.Media.Ocr): the engine, the
    # SoftwareBitmap it reads, and the IBuffer plumbing to feed it pixels.
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# === Linux-only ===
# zbus: holds the session-bus connection that keeps a GNOME Shell screencast
# alive (the shell stops a recording the instant its caller disconnects, so a
# one-shot `gdbus call` records exactly one frame). Already in the tree via xcap.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"
# Multi-target clipboard owner (`trontsnap clip-serve`). Already in the tree via
# winit/arboard with every feature we need, so this adds no new compile.
x11rb = "0.13"

[build-dependencies]
# Embeds the distinct rainbow icon + a Win32 manifest (asInvoker; uiAccess only
# under the `uiaccess` feature, which the installed build turns on).
winresource = "0.1"

[dev-dependencies]
egui-wgpu = "=0.29.1"
pollster = "=0.4.0"

# NOTE: the `uiaccess` feature is deliberately GONE (v0.15.0). Putting uiAccess
# on this binary raises it to HIGH integrity, and Windows blocks drag-and-drop
# across an integrity boundary, so it broke dragging captures into Discord and
# terminals. There is now ONE trontsnap.exe, always Medium; the elevated-window
# hotkey problem is solved by the separate `trontsnap-hotkeys` broker crate.
# Do not reintroduce it here.

[profile.release]
opt-level = 3        # speed over size: this app decodes a lot of images
lto = true
codegen-units = 1
strip = true
panic = "abort"

# HARD-WON: the hotkeys run target/debug/trontsnap, and at opt-level 0 the PNG
# decode + re-encode of a 1366x768 grab cost ~3 s of the ~4.8 s capture-to-clipboard
# latency (an immediate paste got the PREVIOUS clipboard). Optimizing just the
# image-codec deps keeps debug info and incremental builds for our own code.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
# GIF export (gallery): NeuQuant palette + LZW run per frame; at opt-level 0 a 10 s clip
# took minutes in the debug build the hotkeys run.
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
