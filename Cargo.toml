[workspace]
# The hotkey broker is a separate crate because a build script emits ONE manifest
# per crate, and these two binaries need opposite manifests: the UI must stay
# non-uiAccess (Medium, so drag-out works) while the broker must be uiAccess
# (so binds survive elevated windows). See hotkeyd/build.rs.
members = ["hotkeyd"]

[package]
name = "trontsnap"
version = "0.21.0"
edition = "2021"
description = "Fast screenshot tool: global-hotkey capture (full + freeze-frame region) straight to clipboard, plus a lazy-loading gallery over your whole screenshot history"

[dependencies]
eframe = "0.29.1"
xcap = "0.0.15"
image = "0.24.9"
anyhow = "1"
chrono = "0.4"
dirs = "5"
tray-icon = "0.19"
winreg = "0.52"
trash = "5"
opener = "0.7"
crossbeam-channel = "0.5"
walkdir = "2"
notify = "6"
drag = "2.1.1"
raw-window-handle = "0.6"
# Global hotkeys (RegisterHotKey), shutter sound, and the multi-format clipboard
# writer all use Win32 directly. windows 0.56 is already in the lockfile (via
# trash/opener), so this only adds features to the resolved version, no
# duplicate copy.
windows = { version = "0.56", features = [
    # WinRT namespaces for region OCR (Windows.Media.Ocr): the engine, the
    # SoftwareBitmap it reads, and the IBuffer plumbing to feed it pixels.
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Embeds the distinct rainbow icon + a Win32 manifest (asInvoker; uiAccess only
# under the `uiaccess` feature, which the installed build turns on).
winresource = "0.1"

# NOTE: the `uiaccess` feature is deliberately GONE (v0.15.0). Putting uiAccess
# on this binary raises it to HIGH integrity, and Windows blocks drag-and-drop
# across an integrity boundary, so it broke dragging captures into Discord and
# terminals. There is now ONE trontsnap.exe, always Medium; the elevated-window
# hotkey problem is solved by the separate `trontsnap-hotkeys` broker crate.
# Do not reintroduce it here.

[profile.release]
opt-level = 3        # speed over size: this app decodes a lot of images
lto = true
codegen-units = 1
strip = true
panic = "abort"
